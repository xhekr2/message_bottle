# 통합 테스트는 개발 DB(message_bottle)를 건드리지 않고 별도 DB(message_bottle_test)를 쓴다.
# DB 계정은 개발과 같은 환경변수(DB_USERNAME, DB_PASSWORD)를 쓴다. message_bottle_test 데이터베이스는 미리 만들어 둔다.
spring.datasource.url=jdbc:mysql://localhost:3306/message_bottle_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create-drop
letter.expiry-scheduler.enabled=false
