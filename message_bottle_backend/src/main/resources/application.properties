spring.application.name=message_bottle_backend

# MySQL (override with environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Never expose stack traces in error responses
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# JWT (set JWT_SECRET for real use; must be at least 32 bytes)
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdef}
jwt.access-expiration-minutes=60
jwt.refresh-expiration-days=14

# Listen on all interfaces so other devices on the LAN can connect
server.address=0.0.0.0
server.port=8080

# 만료 스케줄러 (만료 판단은 API 호출 시에도 하므로 스케줄러 시점에 의존하지 않는다)
letter.expiry-scheduler.enabled=true
letter.expiry-scheduler.delay-ms=60000
